name: Sync backlog issues to project

on:
  issues:
    types: [opened, reopened, labeled]

permissions:
  issues: read
  repository-projects: write

jobs:
  add-to-backlog:
    uses: andreaspawlik/agentic-engineering-workflows/.github/workflows/project-backlog-sync.yml@v1.6.0
    with:
      workflow_ref: v1.6.0
    secrets: inherit
