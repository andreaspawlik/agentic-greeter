name: Level 5 merge gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  issues: read
  contents: read
  pull-requests: read

jobs:
  evaluate:
    uses: andreaspawlik/agentic-engineering-workflows/.github/workflows/level-5-merge-gate.yml@v1.5.0
    with:
      workflow_ref: v1.5.0
