name: Level 5 coordinator

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number; blank selects the lowest eligible issue"
        required: false
        type: string
      max_repair_iterations:
        description: "Maximum Developer repair iterations before human escalation"
        required: false
        default: "2"
        type: string
      run_id:
        description: "Optional stable run ID for resuming a coordinator run"
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read
  repository-projects: write

jobs:
  coordinate:
    uses: andreaspawlik/agentic-engineering-workflows/.github/workflows/level-5-coordinator.yml@v1.3.0
    with:
      workflow_ref: v1.3.0
      issue_number: ${{ inputs.issue_number }}
      max_repair_iterations: ${{ inputs.max_repair_iterations }}
      run_id: ${{ inputs.run_id }}
    secrets: inherit
