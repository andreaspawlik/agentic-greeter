name: Level 5 PR and CI reconciliation

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  issues: write
  contents: read
  pull-requests: read

jobs:
  reconcile:
    uses: andreaspawlik/agentic-engineering-workflows/.github/workflows/level-5-pr-ci-reconciliation.yml@v1.4.0
    with:
      workflow_ref: v1.4.0
    secrets: inherit
